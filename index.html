<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Ajuste para telas (mobile + desktop) e safe-area no iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Cor da barra do navegador / tema do app -->
    <meta name="theme-color" content="#0b0f17" />

    <!-- PWA no iOS (Adicionar à tela de início) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Banca Pro" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Opcional: melhora preview em redes sociais -->
    <meta property="og:title" content="Banca Pro" />
    <meta
      property="og:description"
      content="Gestão profissional da sua banca: lançamentos, metas e relatórios."
    />
    <meta property="og:type" content="website" />

    <title>Banca Pro</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
